services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: task_tracker
      POSTGRES_PASSWORD: task_tracker
      POSTGRES_DB: task_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_tracker -d task_tracker"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://task_tracker:task_tracker@db:5432/task_tracker?schema=public
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CLIENT_ORIGIN: http://localhost:5173
      API_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    environment:
      VITE_API_URL: http://localhost:3001
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:
